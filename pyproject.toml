[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vin-decode-mcp"
version = "0.1.0"
description = "MCP server for decoding VINs and querying vehicle data from a curated NHTSA vPIC SQLite database"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "VIN Decode MCP Contributors"},
]
license = "MIT"
keywords = ["vin", "vpic", "nhtsa", "vehicle", "mcp", "fastmcp", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "huggingface_hub>=1.0.0",
]

[project.scripts]
vin-decode-mcp = "vin_decode_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
build = [
    "hatchling>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/<org>/vin-decode-mcp"
Repository = "https://github.com/<org>/vin-decode-mcp"
"Bug Tracker" = "https://github.com/<org>/vin-decode-mcp/issues"
Documentation = "https://github.com/<org>/vin-decode-mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/vin_decode_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B"]
lint.ignore = ["E501"]
